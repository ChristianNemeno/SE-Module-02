name: Deploy to DigitalOcean

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/christiannemeno/readright-api

jobs:
  test:
    name: Type-check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgles2 libegl1

      - name: Install dependencies
        run: pip install -r requirements.txt pyright

      - name: Pyright
        run: pyright app/

      - name: Pytest
        run: pytest
        env:
          API_KEY: test-api-key

  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: christiannemeno
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
          DEPLOY_IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GHCR_PAT,GHCR_USER,DEPLOY_IMAGE
          script: |
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker pull "$DEPLOY_IMAGE:latest"

            docker stop readright-api || true
            docker rm readright-api || true

            docker run -d \
              --name readright-api \
              --restart unless-stopped \
              --env-file /etc/readright/env \
              -p 127.0.0.1:8000:8000 \
              "$DEPLOY_IMAGE:latest"

            for i in $(seq 1 12); do
              curl -sf http://localhost:8000/health && echo "healthy" && break
              echo "attempt $i/12 — waiting 10s"
              sleep 10
            done
